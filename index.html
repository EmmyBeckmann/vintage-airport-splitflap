<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vintage Airport Split-Flap Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            font-size: 3em;
            letter-spacing: 12px;
            color: #fff;
            font-weight: 300;
            text-transform: uppercase;
        }

        .board-container {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 10px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }

        .header-row {
            display: contents;
        }

        .header-cell {
            background: #2a2a2a;
            color: #999;
            font-size: 0.9em;
            padding: 12px;
            text-align: center;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .flight-row {
            display: contents;
        }

        .cell {
            background: #000;
            border: 2px solid #333;
            border-radius: 4px;
            padding: 20px 15px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            perspective: 600px;
        }

        .cell::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #222;
            z-index: 5;
        }

        .flap-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .flap {
            position: absolute;
            width: 100%;
            height: 50%;
            backface-visibility: hidden;
            overflow: hidden;
        }

        .flap-top {
            top: 0;
            transform-origin: bottom;
        }

        .flap-bottom {
            bottom: 0;
            transform-origin: top;
        }

        .flap-content {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 1.4em;
            color: #fff;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .flap-top .flap-content {
            top: 0%;
        }

        .flap-bottom .flap-content {
            top: 0;        }

        .airline-name {
            font-size: 0.75em;
            display: block;
            color: #999;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .airline-code {
            font-size: 1.2em;
            font-weight: 500;
        }

        /* Authentic Split-Flap Animation */
        @keyframes flipTopDown {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(-90deg); }
        }

        @keyframes flipBottomUp {
            0% { transform: rotateX(90deg); }
            100% { transform: rotateX(0deg); }
        }

        .cell.flipping .flap-top {
            animation: flipTopDown 0.3s ease-in forwards;
        }

        .cell.flipping .flap-bottom {
            animation: flipBottomUp 0.3s 0.3s ease-out forwards;
        }

        /* Status Color Coding */
        .status-on-time { color: #00ff00 !important; }
        .status-boarding { color: #ffaa00 !important; }
        .status-delayed { color: #ff0000 !important; }
        .status-final-call { color: #ff6600 !important; }
        .status-departed { color: #888 !important; }

        @media (max-width: 1400px) {
            .board {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            
            .flight-row {
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                gap: 10px;
                margin-bottom: 10px;
            }
            
            .flap-content {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">DEPARTURES</div>
        
        <div class="board-container">
            <div class="board" id="board">
                <div class="header-row">
                    <div class="header-cell">Airline</div>
                    <div class="header-cell">Flight</div>
                    <div class="header-cell">Destination</div>
                    <div class="header-cell">Time</div>
                    <div class="header-cell">Status</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Create Solari clicking sound
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        function playClickSound() {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'square';
            
            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.05);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.05);
        }

        const airlines = [
            { code: 'PA', name: 'PAN AM' },
            { code: 'TW', name: 'TWA' },
            { code: 'EA', name: 'EASTERN' },
            { code: 'BN', name: 'BRANIFF' },
            { code: 'NA', name: 'NATIONAL' },
            { code: 'DL', name: 'DELTA' },
            { code: 'UA', name: 'UNITED' },
            { code: 'AA', name: 'AMERICAN' },
            { code: 'WA', name: 'WESTERN' },
            { code: 'CO', name: 'CONTINENTAL' }
        ];

        const destinations = [
            'NEW YORK', 'LONDON', 'PARIS', 'TOKYO', 'LOS ANGELES',
            'CHICAGO', 'MIAMI', 'SAN FRANCISCO', 'BOSTON', 'DALLAS',
            'SEATTLE', 'ATLANTA', 'PHILADELPHIA', 'DETROIT', 'HOUSTON',
            'ROME', 'MADRID', 'AMSTERDAM', 'FRANKFURT', 'ZURICH',
            'MONTREAL', 'TORONTO', 'VANCOUVER', 'MEXICO CITY', 'HONOLULU',
            'ANCHORAGE', 'DENVER', 'PHOENIX', 'LAS VEGAS', 'NEW ORLEANS',
            'MEMPHIS', 'KANSAS CITY', 'MINNEAPOLIS', 'MILWAUKEE', 'CINCINNATI',
            'PITTSBURGH', 'CLEVELAND', 'COLUMBUS', 'INDIANAPOLIS', 'ST LOUIS',
            'ORLANDO', 'TAMPA', 'NASHVILLE', 'CHARLOTTE', 'BALTIMORE',
            'WASHINGTON', 'SAN DIEGO', 'PORTLAND', 'SALT LAKE', 'BUFFALO'
        ];

        const statuses = ['ON TIME', 'BOARDING', 'DELAYED', 'DEPARTED', 'FINAL CALL'];

        function getStatusClass(status) {
            return 'status-' + status.toLowerCase().replace(' ', '-');
        }

        function generateFlight() {
            const airline = airlines[Math.floor(Math.random() * airlines.length)];
            const flightNum = Math.floor(Math.random() * 900) + 100;
            const destination = destinations[Math.floor(Math.random() * destinations.length)];
            const hour = Math.floor(Math.random() * 24);
            const minute = Math.floor(Math.random() * 60);
            const time = `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;
            const status = statuses[Math.floor(Math.random() * statuses.length)];

            return {
                airline: airline,
                flight: `${airline.code}${flightNum}`,
                destination,
                time,
                status
            };
        }

        function createCell(content, className = '', isAirline = false, isStatus = false) {
            const cell = document.createElement('div');
            cell.className = `cell ${className}`;
            
            const wrapper = document.createElement('div');
            wrapper.className = 'flap-wrapper';
            
            if (isAirline) {
                wrapper.innerHTML = `
                    <div class="flap-content">
                        <span class="airline-name">${content.name}</span>
                        <span class="airline-code">${content.code}</span>
                    </div>
                `;
            } else {
                const statusClass = isStatus ? getStatusClass(content) : '';
                wrapper.innerHTML = `
                    <div class="flap flap-top">
                        <div class="flap-content ${statusClass}">${content}</div>
                    </div>
                    <div class="flap flap-bottom">
                        <div class="flap-content ${statusClass}">${content}</div>
                    </div>
                `;
            }
            
            cell.appendChild(wrapper);
            return cell;
        }

        let currentFlights = [];

        function updateBoard() {
            const board = document.getElementById('board');
            const header = board.querySelector('.header-row');
            
            currentFlights = [];
            for (let i = 0; i < 50; i++) {
                currentFlights.push(generateFlight());
            }

        // Remove all existing flight rows
        const flightRows = board.querySelectorAll('.flight-row');
        flightRows.forEach(row => row.remove());
            currentFlights.forEach((flight, index) => {
                setTimeout(() => {
                    const row = document.createElement('div');
                    row.className = 'flight-row';
                    
                    const airlineCell = createCell(flight.airline, '', true, false);
                    const flightCell = createCell(flight.flight, '', false, false);
                    const destCell = createCell(flight.destination, '', false, false);
                    const timeCell = createCell(flight.time, '', false, false);
                    const statusCell = createCell(flight.status, '', false, true);

                    row.appendChild(airlineCell);
                    row.appendChild(flightCell);
                    row.appendChild(destCell);
                    row.appendChild(timeCell);
                    row.appendChild(statusCell);

                    board.appendChild(row);

                    setTimeout(() => {
                        playClickSound();
                        [flightCell, destCell, timeCell, statusCell].forEach(cell => {
                            cell.classList.add('flipping');
                            setTimeout(() => cell.classList.remove('flipping'), 600);
                        });
                    }, 50);
                }, index * 150);
            });
        }

        function rotateDisplay() {
            const cells = document.querySelectorAll('.cell:not(.header-cell)');
            cells.forEach((cell, index) => {
                setTimeout(() => {
                    playClickSound();
                    cell.classList.add('flipping');
                    setTimeout(() => cell.classList.remove('flipping'), 600);
                }, index * 30);
            });
        }

        updateBoard();
        setInterval(updateBoard, 25000);
        setInterval(rotateDisplay, 10000);
    </script>
</body>
</html>
