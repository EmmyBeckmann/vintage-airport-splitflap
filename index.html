<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heathrow Terminal 3 - 1971 Solari Display</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            font-family: 'IBM Plex Mono', 'Courier New', monospace;
            color: #fff;
            min-height: 100vh;
            padding: 30px 20px;
            overflow-x: hidden;
        }

        .airport-header {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            letter-spacing: 8px;
            color: #fff;
            font-weight: 300;
            text-transform: uppercase;
        }

        .board-frame {
            max-width: 1800px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 40px;
            border-radius: 5px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .column-headers {
            display: grid;
            grid-template-columns: 80px 120px 1fr 120px 150px;
            gap: 8px;
            margin-bottom: 15px;
            padding: 0 10px;
            font-size: 0.9em;
            color: #999;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .flight-row {
            display: grid;
            grid-template-columns: 80px 120px 1fr 120px 150px;
            gap: 8px;
            margin-bottom: 8px;
        }

        .flap-module {
            position: relative;
            background: #000;
            border-radius: 3px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 2px 5px rgba(0,0,0,0.3);
        }

        .airline-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 8px;
            background: #000;
            border-radius: 3px;
            position: relative;
        }

        .airline-code {
            font-size: 1.4em;
            font-weight: 700;
            color: #fff;
            text-align: center;
            padding: 4px;
            border-radius: 3px;
            letter-spacing: 1px;
        }

        .ba { background: #075aaa; }
        .tw { background: #c8102e; }
        .pa { background: #003366; }
        .lh { background: #f9b000; color: #003366 !important; }
        .af { background: #002157; }
        .kl { background: #00a1de; }
        .ly { background: #d40f14; }
        .rg { background: #00843d; }
        .oa { background: #003478; }

        .flap-cell {
            position: relative;
            padding: 18px 12px;
            background: #000;
            border-radius: 3px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .flap-cell::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #1a1a1a;
            z-index: 2;
        }

        .flap-cell::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, 
                rgba(255,255,255,0.05) 0%, 
                transparent 20%, 
                transparent 80%, 
                rgba(0,0,0,0.4) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .flap-content {
            position: relative;
            z-index: 3;
            color: #fff;
            font-size: 1.8em;
            font-weight: 600;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .flap-cell.flipping .flap-content {
            animation: flapFlip 0.4s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        @keyframes flapFlip {
            0% { 
                transform: perspective(400px) rotateX(0deg);
                opacity: 1;
            }
            45% { 
                transform: perspective(400px) rotateX(90deg);
                opacity: 0.3;
            }
            55% { 
                transform: perspective(400px) rotateX(-90deg);
                opacity: 0.3;
            }
            100% { 
                transform: perspective(400px) rotateX(0deg);
                opacity: 1;
            }
        }

        .flight-number .flap-content {
            font-size: 1.6em;
            letter-spacing: 3px;
        }

        .destination .flap-content {
            font-size: 1.7em;
            letter-spacing: 1px;
        }

        .time .flap-content {
            font-size: 1.9em;
            font-weight: 700;
        }

        .status .flap-content {
            font-size: 1.3em;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="airport-header">DEPARTURES</div>
    
    <div class="board-frame">
        <div class="column-headers">
            <div>AIRLINE</div>
            <div>FLIGHT</div>
            <div>DESTINATION</div>
            <div>TIME</div>
            <div>STATUS</div>
        </div>
        <div id="flightBoard"></div>
    </div>

    <script>
        const airlines1971 = [
            { code: 'BA', name: 'BRITISH AIRWAYS', class: 'ba' },
            { code: 'TW', name: 'TWA', class: 'tw' },
            { code: 'PA', name: 'PAN AM', class: 'pa' },
            { code: 'LH', name: 'LUFTHANSA', class: 'lh' },
            { code: 'AF', name: 'AIR FRANCE', class: 'af' },
            { code: 'KL', name: 'KLM', class: 'kl' },
            { code: 'LY', name: 'EL AL', class: 'ly' },
            { code: 'RG', name: 'VARIG', class: 'rg' },
            { code: 'OA', name: 'OLYMPIC', class: 'oa' }
        ];

        const destinations1971 = [
            'NEW YORK', 'PARIS', 'FRANKFURT', 'AMSTERDAM', 'ROME', 'ATHENS',
            'BEIRUT', 'TEL AVIV', 'BOMBAY', 'TEHERAN', 'SINGAPORE',
            'HONG KONG', 'TOKYO', 'SYDNEY', 'JOHANNESBURG', 'NAIROBI',
            'CAIRO', 'ISTANBUL', 'ZURICH', 'GENEVA', 'MADRID', 'LISBON',
            'COPENHAGEN', 'STOCKHOLM', 'OSLO', 'BRUSSELS', 'VIENNA',
            'MUNICH', 'BERLIN', 'HAMBURG', 'DÜSSELDORF', 'BARCELONA',
            'MILAN', 'VENICE', 'NICE', 'MONTREAL', 'TORONTO',
            'CHICAGO', 'LOS ANGELES', 'SAN FRANCISCO', 'BOSTON',
            'WASHINGTON', 'MIAMI', 'CARACAS', 'RIO DE JANEIRO',
            'BUENOS AIRES', 'MEXICO CITY', 'DELHI', 'KARACHI', 'BAGHDAD'
        ];

        const statuses = ['ON TIME', 'BOARDING', 'DELAYED', 'DEPARTED', 'FINAL CALL'];

        function generateFlight() {
            const airline = airlines1971[Math.floor(Math.random() * airlines1971.length)];
            const flightNum = Math.floor(Math.random() * 900) + 100;
            const destination = destinations1971[Math.floor(Math.random() * destinations1971.length)];
            const hour = Math.floor(Math.random() * 24);
            const minute = Math.floor(Math.random() * 60);
            const time = `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;
            const status = statuses[Math.floor(Math.random() * statuses.length)];

            return {
                airline,
                flight: `${airline.code}${flightNum}`,
                destination,
                time,
                status
            };
        }

        function createFlightRow(flight, delay = 0) {
            const row = document.createElement('div');
            row.className = 'flight-row';

            const airline = document.createElement('div');
            airline.className = 'airline-logo';
            airline.innerHTML = `<div class="airline-code ${flight.airline.class}">${flight.airline.code}</div>`;

            const flightCell = document.createElement('div');
            flightCell.className = 'flap-module flight-number';
            flightCell.innerHTML = `<div class="flap-cell"><div class="flap-content">${flight.flight}</div></div>`;

            const destCell = document.createElement('div');
            destCell.className = 'flap-module destination';
            destCell.innerHTML = `<div class="flap-cell"><div class="flap-content">${flight.destination}</div></div>`;

            const timeCell = document.createElement('div');
            timeCell.className = 'flap-module time';
            timeCell.innerHTML = `<div class="flap-cell"><div class="flap-content">${flight.time}</div></div>`;

            const statusCell = document.createElement('div');
            statusCell.className = 'flap-module status';
            statusCell.innerHTML = `<div class="flap-cell"><div class="flap-content">${flight.status}</div></div>`;

            row.appendChild(airline);
            row.appendChild(flightCell);
            row.appendChild(destCell);
            row.appendChild(timeCell);
            row.appendChild(statusCell);

            setTimeout(() => {
                const cells = row.querySelectorAll('.flap-cell');
                cells.forEach((cell, index) => {
                    setTimeout(() => {
                        playFlapSound();
                        cell.classList.add('flipping');
                        setTimeout(() => cell.classList.remove('flipping'), 400);
                    }, index * 80);
                });
            }, delay);

            return row;
        }

        function playFlapSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'square';
            
            gainNode.gain.setValueAtTime(0.03, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.08);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.08);
        }

        function updateBoard() {
            const board = document.getElementById('flightBoard');
            board.innerHTML = '';

            for (let i = 0; i < 50; i++) {
                const flight = generateFlight();
                const row = createFlightRow(flight, i * 120);
                board.appendChild(row);
            }
        }

        function randomFlips() {
            const cells = document.querySelectorAll('.flap-cell');
            const randomCells = Array.from(cells)
                .sort(() => Math.random() - 0.5)
                .slice(0, Math.floor(Math.random() * 10) + 5);
            
            randomCells.forEach((cell, index) => {
                setTimeout(() => {
                    playFlapSound();
                    cell.classList.add('flipping');
                    setTimeout(() => cell.classList.remove('flipping'), 400);
                }, index * 100);
            });
        }

        updateBoard();
        setInterval(updateBoard, 25000);
        setInterval(randomFlips, 8000);
    </script>
</body>
</html>
