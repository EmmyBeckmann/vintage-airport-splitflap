<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vintage Airport Split-Flap Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            font-size: 3em;
            letter-spacing: 12px;
            color: #fff;
            font-weight: 300;
            text-transform: uppercase;
        }

        .board-container {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 10px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }

        .header-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 20px;
            font-size: 1.2em;
            text-align: center;
            letter-spacing: 2px;
            font-weight: 700;
            text-transform: uppercase;
            color: #ffa500;
        }

        .flight-row {
            display: contents;
        }

        .cell {
            background: #000;
            border: 3px solid #333;
            border-radius: 8px;
            padding: 25px 15px;
            text-align: center;
            font-size: 2.5em;
            font-weight: 700;
            letter-spacing: 3px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            font-family: 'Courier New', Courier, monospace;
        }

        .cell::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: #222;
            transform: translateY(-50%);
            z-index: 1;
        }

        .cell::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, 
                rgba(255,255,255,0.1) 0%, 
                transparent 10%, 
                transparent 90%, 
                rgba(0,0,0,0.3) 100%);
            pointer-events: none;
        }

        .flap-content {
            position: relative;
            z-index: 2;
            color: #ffa500;
            text-shadow: 0 0 10px rgba(255,165,0,0.5);
        }

        .cell.flipping .flap-content {
            animation: flipAnimation 0.6s ease-in-out;
        }

        @keyframes flipAnimation {
            0% { transform: scaleY(1); opacity: 1; }
            25% { transform: scaleY(0.8); opacity: 0.8; }
            50% { transform: scaleY(0.3); opacity: 0.3; }
            75% { transform: scaleY(0.8); opacity: 0.8; }
            100% { transform: scaleY(1); opacity: 1; }
        }

        .cell.airline {
            font-size: 1.8em;
            padding: 25px 10px;
            letter-spacing: 1px;
        }

        .cell.status {
            font-size: 1.6em;
            padding: 25px 10px;
        }

        .cell.status .flap-content {
            font-weight: 700;
        }

        .status-on-time .flap-content {
            color: #00ff00 !important;
            text-shadow: 0 0 10px rgba(0,255,0,0.5);
        }

        .status-boarding .flap-content {
            color: #00bfff !important;
            text-shadow: 0 0 10px rgba(0,191,255,0.5);
        }

        .status-delayed .flap-content {
            color: #ff4500 !important;
            text-shadow: 0 0 10px rgba(255,69,0,0.5);
        }

        .status-departed .flap-content {
            color: #888 !important;
            text-shadow: 0 0 10px rgba(136,136,136,0.3);
        }

        .status-final-call .flap-content {
            color: #ff0000 !important;
            text-shadow: 0 0 10px rgba(255,0,0,0.5);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">DEPARTURES</div>
        <div class="board-container">
            <div class="header-row">
                <div>AIRLINE</div>
                <div>FLIGHT</div>
                <div>DESTINATION</div>
                <div>TIME</div>
                <div>STATUS</div>
            </div>
            <div class="board" id="board"></div>
        </div>
    </div>

    <script>
        const airlines = [
            'PAN AM', 'TWA', 'EASTERN', 'WESTERN', 'BRANIFF', 'UNITED', 'DELTA', 'AMERICAN',
            'NORTHWEST', 'CONTINENTAL', 'PIEDMONT', 'REPUBLIC', 'OZARK', 'PSA', 'HUGHES',
            'NATIONAL', 'ALLEGHENY', 'FRONTIER', 'NORTH CENTRAL', 'SOUTHERN', 'TEXAS INTL',
            'AIR CALIFORNIA', 'SOUTHWEST', 'MOHAWK', 'LAKE CENTRAL'
        ];

        const cities = [
            'NEW YORK', 'LOS ANGELES', 'CHICAGO', 'SAN FRANCISCO', 'MIAMI', 'BOSTON',
            'WASHINGTON', 'SEATTLE', 'DETROIT', 'DALLAS', 'ATLANTA', 'PHILADELPHIA',
            'HOUSTON', 'PHOENIX', 'SAN DIEGO', 'DENVER', 'PORTLAND', 'MINNEAPOLIS',
            'ST LOUIS', 'BALTIMORE', 'SALT LAKE', 'BUFFALO', 'OAKLAND', 'PITTSBURGH',
            'SAN ANTONIO', 'MEMPHIS', 'KANSAS CITY', 'NASHVILLE', 'MILWAUKEE', 'CLEVELAND',
            'NEW ORLEANS', 'INDIANAPOLIS', 'CINCINNATI', 'CHARLOTTE', 'TAMPA', 'ORLANDO',
            'MONTREAL', 'TORONTO', 'VANCOUVER', 'LONDON', 'PARIS', 'ROME', 'TOKYO',
            'HONG KONG', 'SYDNEY', 'MEXICO CITY', 'HONOLULU', 'ANCHORAGE', 'JUNEAU', 'RENO'
        ];

        const statuses = ['ON TIME', 'BOARDING', 'DELAYED', 'DEPARTED', 'FINAL CALL'];

        function getStatusClass(status) {
            return 'status-' + status.toLowerCase().replace(' ', '-');
        }

        function generateFlight() {
            const airline = airlines[Math.floor(Math.random() * airlines.length)];
            const flightNum = Math.floor(Math.random() * 900) + 100;
            const destination = cities[Math.floor(Math.random() * cities.length)];
            const hour = Math.floor(Math.random() * 24);
            const minute = Math.floor(Math.random() * 60);
            const time = `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;
            const status = statuses[Math.floor(Math.random() * statuses.length)];

            return {
                airline: airline,
                flight: `${airline.code || flightNum}`,
                destination,
                time,
                status
            };
        }

        function createCell(content, className = '', isAirline = false, isStatus = false) {
            const cell = document.createElement('div');
            cell.className = `cell ${className}`;
            if (isAirline) cell.classList.add('airline');
            if (isStatus) cell.classList.add('status');
            cell.innerHTML = `<div class="flap-content">${content}</div>`;
            return cell;
        }

        let currentFlights = [];

        function updateBoard() {
            const board = document.getElementById('board');
            const header = board.querySelector('.header-row');

            currentFlights = [];
            for (let i = 0; i < 50; i++) {
                currentFlights.push(generateFlight());
            }

            // Remove all existing flight rows
            const flightRows = board.querySelectorAll('.flight-row');
            flightRows.forEach(row => row.remove());

            currentFlights.forEach((flight, index) => {
                setTimeout(() => {
                    const row = document.createElement('div');
                    row.className = 'flight-row';

                    const airlineCell = createCell(flight.airline, '', true, false);
                    const flightCell = createCell(flight.flight, '', false, false);
                    const destCell = createCell(flight.destination, '', false, false);
                    const timeCell = createCell(flight.time, '', false, false);
                    const statusCell = createCell(flight.status, getStatusClass(flight.status), false, true);

                    row.appendChild(airlineCell);
                    row.appendChild(flightCell);
                    row.appendChild(destCell);
                    row.appendChild(timeCell);
                    row.appendChild(statusCell);

                    board.appendChild(row);

                    setTimeout(() => {
                        playClickSound();
                        [airlineCell, flightCell, destCell, timeCell, statusCell].forEach(cell => {
                            cell.classList.add('flipping');
                            setTimeout(() => cell.classList.remove('flipping'), 600);
                        });
                    }, 50);
                }, index * 150);
            });
        }

        function rotateDisplay() {
            const cells = document.querySelectorAll('.cell:not(.header-cell)');
            cells.forEach((cell, index) => {
                setTimeout(() => {
                    playClickSound();
                    cell.classList.add('flipping');
                    setTimeout(() => cell.classList.remove('flipping'), 600);
                }, index * 30);
            });
        }

        function playClickSound() {
            // Audio context for click sound
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 100;
            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }

        updateBoard();
        setInterval(updateBoard, 25000);
        setInterval(rotateDisplay, 10000);
    </script>
</body>
</html>
